name: Meson

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Enable long paths
      if: runner.os == 'Windows'
      run: git config --global core.longpaths true

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Meson and Ninja
      run: python -m pip install meson ninja

    - name: Set up GCC (Linux)
      if: runner.os == 'Linux'
      uses: egor-tensin/setup-gcc@v2
      with:
        version: 15
        platform: x64

    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # MSVC environment variables are exported by msvc-dev-cmd; make
    # meson select the MSVC compiler explicitly over any gcc on PATH
    - name: Select MSVC (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "CC=cl" >> $GITHUB_ENV
        echo "CXX=cl" >> $GITHUB_ENV

    # macOS builds with the runner's default (Apple clang)

    - name: Configure
      run: meson setup build -Dbuildtype=release -Ddebug=true -Dimgui:sdl2=enabled -Dimgui:sdl2_renderer=enabled -Dlibtiff:zlib=enabled -Dmimalloc:override=false

    - name: Build
      run: meson compile -C build

    - name: Test
      run: meson test -C build --print-errorlogs

    # when the suite fails on macOS, capture a backtrace from the
    # actual failing binary: the isolated-case and ASan reruns may
    # pass while the plain build traps (the job log truncates the
    # printed errorlog under the tiff warning flood)
    - name: Backtrace the failing test (macOS)
      if: failure() && runner.os == 'macOS'
      run: |
        export PATH="$PWD/build/test:$PWD/build/subprojects/tiff-4.7.1/libtiff:$PWD/build/subprojects/zlib-1.3.2:$PWD/build/subprojects/mimalloc-3.3.2:$PATH"
        cd build/test
        lldb --batch -o run -o "thread backtrace all" -o quit -- ./image_algos_test
      continue-on-error: true

    # image_algos_test reproducibly crashes on macOS at a point that
    # moves between runs and an isolated rerun of the crashing case
    # passes - the signature of heap corruption from an earlier case
    # in the same process. reproduce the full suite under ASan in a
    # second build directory, with mimalloc's allocator override
    # disabled so the sanitizer owns allocations and the corrupting
    # write is reported with a stack trace; release+fast-math keeps
    # the codegen under which the corruption occurs
    - name: Reproduce under ASan (macOS)
      if: failure() && runner.os == 'macOS'
      run: |
        meson setup build-asan -Dbuildtype=release -Ddebug=true -Dasan=true -Dmimalloc:override=false -Dimgui:sdl2=enabled -Dimgui:sdl2_renderer=enabled -Dlibtiff:zlib=enabled
        ninja -C build-asan test/image_algos_test
        cd build-asan/test && ASAN_OPTIONS=detect_leaks=0 ./image_algos_test
      continue-on-error: true

    # on windows the same test aborts with STATUS_HEAP_CORRUPTION
    # (0xc0000374): some write past a heap block. reproduce under
    # MSVC's AddressSanitizer to have the corrupting write reported
    # with a stack trace, in a second build directory with mimalloc's
    # allocator override disabled so the sanitizer owns allocations;
    # run from the test workdir (data files), with the wrap dlls on
    # PATH as meson's test runner does
    - name: Reproduce under ASan (Windows)
      if: failure() && runner.os == 'Windows'
      run: |
        meson setup build-asan -Dbuildtype=release -Ddebug=true -Dasan=true -Dmimalloc:override=false -Dimgui:sdl2=enabled -Dimgui:sdl2_renderer=enabled -Dlibtiff:zlib=enabled
        meson compile -C build-asan image_algos_test
        $env:PATH = "${{ github.workspace }}\build-asan\test;${{ github.workspace }}\build-asan\subprojects\tiff-4.7.1\libtiff;${{ github.workspace }}\build-asan\subprojects\zlib-1.3.2;${{ github.workspace }}\build-asan\subprojects\mimalloc-3.3.2;$env:PATH"
        $env:ASAN_OPTIONS = "detect_leaks=0:halt_on_error=1:abort_on_error=1"
        cd build-asan\test
        .\image_algos_test.exe
      continue-on-error: true
