name: Meson

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Enable long paths
      if: runner.os == 'Windows'
      run: git config --global core.longpaths true

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Meson and Ninja
      run: python -m pip install meson ninja

    - name: Set up GCC (Linux)
      if: runner.os == 'Linux'
      uses: egor-tensin/setup-gcc@v2
      with:
        version: 15
        platform: x64

    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # MSVC environment variables are exported by msvc-dev-cmd; make
    # meson select the MSVC compiler explicitly over any gcc on PATH
    - name: Select MSVC (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "CC=cl" >> $GITHUB_ENV
        echo "CXX=cl" >> $GITHUB_ENV

    # macOS builds with the runner's default (Apple clang)

    - name: Configure
      run: meson setup build -Dbuildtype=release -Dimgui:sdl2=enabled -Dimgui:sdl2_renderer=enabled

    - name: Build
      run: meson compile -C build

    - name: Test
      run: meson test -C build --print-errorlogs

    # diagnose image_algos_test on windows: its corr_a.tiff loads
    # fail with "failed to open" only under meson; show the build/test
    # directory contents and rerun the binary from that directory via
    # bash (the environment meson uses is reproduced as far as possible)
    - name: Diagnose failing test (Windows)
      if: failure() && runner.os == 'Windows'
      shell: bash
      run: |
        echo "=== workspace ==="; pwd; ls build/test | head -12
        echo "=== corr_a.tiff ==="; ls -la build/test/corr_a.tiff || echo "MISSING"
        export PATH="$PWD/build/subprojects/mimalloc-3.3.2:$PWD/build/subprojects/tiff-4.7.1/libtiff:$PWD/build/test:$PATH"
        cd build/test && ./image_algos_test.exe
      continue-on-error: true
