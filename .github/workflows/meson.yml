name: Meson

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Enable long paths
      if: runner.os == 'Windows'
      run: git config --global core.longpaths true

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Meson and Ninja
      run: python -m pip install meson ninja

    - name: Set up GCC (Linux)
      if: runner.os == 'Linux'
      uses: egor-tensin/setup-gcc@v2
      with:
        version: 15
        platform: x64

    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # MSVC environment variables are exported by msvc-dev-cmd; make
    # meson select the MSVC compiler explicitly over any gcc on PATH
    - name: Select MSVC (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "CC=cl" >> $GITHUB_ENV
        echo "CXX=cl" >> $GITHUB_ENV

    # macOS builds with the runner's default (Apple clang)

    - name: Configure
      run: meson setup build -Dbuildtype=release -Ddebug=true -Dimgui:sdl2=enabled -Dimgui:sdl2_renderer=enabled -Dlibtiff:zlib=enabled

    - name: Build
      run: meson compile -C build

    - name: Test
      run: meson test -C build --print-errorlogs

    # on macOS, image_algos_test reproducibly crashes in
    # auto_correlate; rerun that single case under lldb and dump
    # backtraces from the point of the crash (the build carries
    # debug symbols via -Ddebug=true). run from the test workdir so
    # the test data files are found
    - name: Backtrace the crashing test (macOS)
      if: failure() && runner.os == 'macOS'
      run: |
        export PATH="$PWD/build/test:$PWD/build/subprojects/tiff-4.7.1/libtiff:$PWD/build/subprojects/mimalloc-3.3.2:$PATH"
        cd build/test
        lldb --batch \
          -o run \
          -o "thread backtrace all" \
          -o "register read" \
          -o quit -- \
          ./image_algos_test -tc="image_algos_test - auto_correlation_test"
      continue-on-error: true
